# Fully isolated test stack: no host ports, production volumes or Traefik network.
name: yu-ci
x-test-environment: &test-environment
  DATABASE_URL: postgresql://yu_test:isolated_test_password@db:5432/yu_test
  APP_ORIGIN: http://app:3000
  OIDC_ISSUER: http://mock-oidc:3102
  OIDC_CLIENT_ID: yu-test
  OIDC_CLIENT_SECRET: isolated_test_secret
  OIDC_ALLOW_INSECURE_HTTP: "true"
  YU_TEST_BASE_URL: http://app:3000
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: yu_test
      POSTGRES_USER: yu_test
      POSTGRES_PASSWORD: isolated_test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yu_test -d yu_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build:
      context: .
      target: migrator
    environment: *test-environment
    depends_on:
      db:
        condition: service_healthy
  mock-oidc:
    build:
      context: .
      target: oidc-test
    environment:
      <<: *test-environment
      MOCK_OIDC_ENABLED: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3102/.well-known/openid-configuration').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build:
      context: .
      target: runner
    environment: *test-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      mock-oidc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
  tests:
    build:
      context: .
      target: integration-test
    environment: *test-environment
    depends_on:
      app:
        condition: service_healthy
networks:
  default:
    internal: true
